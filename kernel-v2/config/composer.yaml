server:
  socket_path: "./data/composer.sock"
  workers: 2
  max_concurrent_requests: 50
  request_timeout_seconds: 30

# Prompt Configuration
prompts:
  thread:
    path: "./prompts/thread.md"
  # Asset-based prompt composition settings
  assets_dir: "./prompts/assets"
  compositions_dir: "./prompts/compositions"

providers:
  bash:
    timeout_seconds: 30
    max_output_size: 100000
    blocked_commands:
      - "rm -rf /"
      - "mkfs"
      - "dd if=/dev/zero"
    patterns_file: "./data/bash_patterns.yaml"
  
  code:
    index:
      database_path: "./data/code_index.db"
      update_interval_seconds: 300
      paths: []
  
  memory:
    database_path: "./data/memory.db"
    max_facts_per_query: 50
    default_categories:
      - "general"

permissions:
  default_token_ttl_seconds: 3600
  default_max_calls: 100
  policy_file: "./data/policies.yaml"

# Prime Personality Configuration
prime:
  prompt_path: "/home/eziothean/ProClaw/kernel-v2/prompts/prime.md"
  temperature: 0.3
  max_tokens: 4096

gateway:
  url: "http://localhost:3000"
  auth_token: "default-token-change-in-production"
  webhook_path: "/gateway/webhook/kernel-response"

observability:
  metrics:
    enabled: true
    port: 9090
    path: "/metrics"
  
  traces:
    base_path: "./data/traces"
    retention_days: 30
    compress_after_hours: 24
    compression_algorithm: "zstd"
    compression_level: 3
  
  audit:
    path: "./data/audit.log"
    level: "info"
  
  logging:
    level: "info"
    format: "json"
    output: "stdout"
