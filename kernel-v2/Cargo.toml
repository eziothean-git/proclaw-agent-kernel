[package]
name = "proclaw-block-composer"
version = "0.1.0"
edition = "2021"
authors = ["ProClaw Team"]
description = "High-performance context composition service for Agent Kernel"
license = "MIT OR Apache-2.0"
repository = "https://github.com/proclaw/proclaw"
rust-version = "1.75"

[[bin]]
name = "proclaw-composer"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full", "rt-multi-thread"] }
tokio-stream = "0.1"
async-trait = "0.1"
futures = "0.3"

# gRPC
tonic = "0.11"
tonic-reflection = "0.11"
prost = "0.12"
prost-types = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
quick-xml = { version = "0.31", features = ["serialize"] }

# Configuration
config = "0.14"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Hashing
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
base64 = "0.21"

# Caching
lru = "0.12"

# Random
rand = "0.8"

# UUID
uuid = { version = "1.6", features = ["v4"] }

# Concurrent hash map
dashmap = "5.5"

# Regex for pattern matching
regex = "1.10"

# JWT for token handling
jsonwebtoken = "9"

# Static configuration
lazy_static = "1.4"

# Compression
zstd = "0.13"

# Database
rusqlite = { version = "0.30", features = ["bundled", "chrono", "serde_json"] }

# HTTP client (for callbacks)
reqwest = { version = "0.11", features = ["json"], optional = true }

# Metrics
prometheus = { version = "0.13", features = ["process"] }

# CLI
clap = { version = "4.4", features = ["derive", "env"] }

# Notify systemd
sd-notify = { version = "0.4", optional = true }

[build-dependencies]
tonic-build = "0.11"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"
tempfile = "3.9"
criterion = { version = "0.5", features = ["async_tokio"] }

[features]
default = ["reqwest", "systemd"]
systemd = ["dep:sd-notify"]
control-plane = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[[bench]]
name = "composition_benchmark"
harness = false
