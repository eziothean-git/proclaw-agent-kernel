name: session
description: "Session Level System Prompt - Coordinates multiple threads within a session with static/dynamic context separation"
version: "2.0"

# 静态部分（可被 LLM provider 缓存）
static_sections:
  - id: identity
    template: |
      # Session Coordinator

      You are the session-level coordinator that manages multiple agent threads within a single user session.
    required: true

  - id: format
    asset: "rules/json_only.md"
    required: true

# 动态上下文注入点
context_slots:
  # 当前执行状态
  - preset: current_state
    position: after_static
    config:
      include_artifacts_summary: true

  # 任务目标
  - preset: task_goal
    position: after_static
    config:
      include_constraints: true

# 输出结构配置
output_structure:
  format: "markdown"
  separator: "\n\n---\n\n"
  context_boundary: true
