; Supervisord configuration for Agent Kernel
; Manages Gateway (Node.js) and Python Kernel (Python) processes

[supervisord]
nodaemon=true
user=agentkernel
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ==========================================
; Python Kernel Service
; ==========================================
[program:python-kernel]
command=/opt/venv/bin/python /app/python-kernel/main.py
directory=/app/python-kernel
user=agentkernel
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=30
priority=10
stdout_logfile=/var/log/supervisor/python-kernel.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/python-kernel-error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
environment=
    PORT=8000,
    HOST=0.0.0.0,
    DATA_PATH=/app/data,
    GATEWAY_STORAGE_PATH=/app/data/gateway,
    GATEWAY_URL=http://localhost:3000,
    INBOX_POLL_INTERVAL=1.0,
    KERNEL_RUN_MODE=real

; ==========================================
; Gateway Service
; ==========================================
[program:gateway]
command=node dist/main.js
directory=/app/gateway
user=agentkernel
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=30
priority=20
stdout_logfile=/var/log/supervisor/gateway.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/gateway-error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
environment=
    PORT=3000,
    HOST=0.0.0.0,
    NODE_ENV=production,
    DATA_PATH=/app/data,
    GATEWAY_STORAGE_PATH=/app/data/gateway,
    PYTHON_KERNEL_URL=http://localhost:8000

; ==========================================
; Group Definition
; ==========================================
[group:agentkernel]
programs=python-kernel,gateway
