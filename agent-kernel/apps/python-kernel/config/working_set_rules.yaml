# Working Set Builder Configuration
# Rule-driven context construction for Agent Threads

version: "1.0"

# Phase-specific configurations
phases:
  explore:
    description: "Information gathering phase - collect context and understand the problem"
    slot_selection:
      # Artifact types relevant for exploration
      slot_types:
        - module_map
        - symbol_index
        - context_report
        - file_tree
        - dependency_graph
      max_slots: 3
      priority_threshold: 5  # Only include artifacts with priority >= 5
    observation_selection:
      max_count: 10
      lookback_steps: 20  # Consider last 20 events (None for unlimited)
      priority_event_types:
        - tool_result
        - observation
        - error

  execute:
    description: "Action execution phase - perform actual changes"
    slot_selection:
      # Artifact types relevant for execution
      slot_types:
        - patch_plan
        - dependency_summary
        - test_plan
        - verification_result
        - change_set
      max_slots: 4
      priority_threshold: 5
    observation_selection:
      max_count: 5
      lookback_steps: 10
      priority_event_types:
        - tool_result
        - error

  complete:
    description: "Completion phase - finalize and summarize"
    slot_selection:
      # Artifact types for completion
      slot_types:
        - final_result
        - summary
        - next_steps
        - lessons_learned
      max_slots: 2
      priority_threshold: 1  # Lower threshold for completion
    observation_selection:
      max_count: 3
      lookback_steps: 5
      priority_event_types:
        - tool_result

# Artifact type priorities (1-10, higher = more important)
# Used when selecting which artifacts to include in Working Set
artifact_priorities:
  # High priority (8-10)
  final_result: 10
  patch_plan: 9
  summary: 9
  verification_result: 8
  test_plan: 8
  module_map: 8
  
  # Medium priority (5-7)
  symbol_index: 7
  dependency_summary: 7
  next_steps: 7
  lessons_learned: 7
  change_set: 6
  context_report: 6
  
  # Lower priority (1-4)
  file_tree: 5
  dependency_graph: 5
  raw_output: 3
  debug_info: 2

# Token budget allocation
# Total should not exceed model's context window
token_budget:
  max_total: 4000
  reserved_for_immutable: 500      # Task goal, constraints, etc.
  reserved_for_observations: 1500  # Recent events/results
  reserved_for_artifacts: 1500     # Selected artifact slots
  reserved_for_notes: 500          # Additional context notes

# Additional settings
settings:
  # Whether to include phase transition hints in prompts
  include_phase_hints: true
  
  # Whether to include token estimates in Working Set
  include_token_estimate: true
  
  # Truncation strategy when exceeding budget
  # "observations_first" - truncate observations before artifacts
  # "artifacts_first" - truncate artifacts before observations
  # "balanced" - truncate both proportionally
  truncation_strategy: "observations_first"
  
  # Minimum observations to keep even when truncating
  min_observations: 2
  
  # Minimum artifacts to keep even when truncating
  min_artifacts: 1
